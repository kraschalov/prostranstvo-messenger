name: build

on:
  push:
    tags:
      - "build-*"
  workflow_dispatch:

jobs:
  backend-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.os }}" = "windows-latest" ]; then pip install -r backend/requirements-windows.txt; else pip install -r backend/requirements.txt; fi
        shell: bash
      - name: Import check (no Linux-only deps)
        run: |
          cd backend
          python -c "import app.config, app.db, app.crypto, app.deps, app.federation, app.netcheck, app.updater, app.directory, app.ws_manager; print('core OK')"
          python -c "import app.routers.admin, app.routers.auth, app.routers.topics, app.routers.sync, app.routers.servers; print('routers OK')"

  android-apk:
    runs-on: ubuntu-latest
    needs: backend-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
      - name: Build debug APK (no release key in repo)
        run: |
          cd mobile
          flutter pub get
          flutter build apk --debug
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
